apply plugin: 'com.android.application'
apply plugin: 'com.google.firebase.crashlytics'


project.ext {
    excludeAppGlideModule = true
}

android {
    compileSdk 37
    namespace 'com.yamilab.animalsounds'

    defaultConfig {
        applicationId "com.yamilab.animalsounds"
        minSdk 23
        targetSdk 37
        versionCode 95
        versionName "3.9.5"
        multiDexEnabled true
        lintOptions {
            checkReleaseBuilds true
            abortOnError false
        }
    }
    buildFeatures {
        buildConfig = true
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = 11
        targetCompatibility = 11
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation "androidx.browser:browser:1.10.0"
    implementation "androidx.vectordrawable:vectordrawable-animated:1.2.0"
    implementation "androidx.media:media:1.8.0"
    implementation "androidx.legacy:legacy-support-v4:1.0.0"
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.core:core-splashscreen:1.2.0'
    implementation "androidx.cardview:cardview:1.0.0"
    implementation "androidx.viewpager2:viewpager2:1.1.0"
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    // Explicitly pin a modern WorkManager. AdMob (play-services-ads) pulls in an old
    // transitive work-runtime 2.7.0, which crashes on Firebase Test Lab devices with
    // "Failed to create an instance of androidx.work.impl.WorkDatabase".
    implementation 'androidx.work:work-runtime:2.11.2'
    implementation 'com.google.android.gms:play-services-ads:25.4.0'
    implementation 'com.google.firebase:firebase-crashlytics:20.1.0'
    implementation 'com.github.AppIntro:AppIntro:6.3.1'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    annotationProcessor 'androidx.annotation:annotation:1.10.0'
    implementation 'com.codemybrainsout.rating:ratingdialog:1.0.8'
    implementation platform('com.google.firebase:firebase-bom:34.18.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-perf'
    implementation 'com.google.firebase:firebase-storage'
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-config'
}
configurations.all {
    exclude group: 'com.google.android.gms', module: 'play-services-safetynet'
}
apply plugin: 'com.google.gms.google-services'
